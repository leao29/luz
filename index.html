<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dra. Débora - Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght=0,400;0,600;1,400&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-espacial: #020613;
            --vermelho-militar: #991b1b;
            --ferro-prata: #94a3b8;
            --papel-canva: #f4ecd8;
            --ouro-escuro: #614d1a;
            --ouro-brilhante: #d4af37;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--azul-espacial);
            font-family: 'Lora', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* FUNDO DE CÉU AZUL ESCURO COM BORBOLETAS E ESTRELAS PULSANTES */
        #cenario-cosmos {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #071330 0%, var(--azul-espacial) 100%);
        }

        .estrela-pulsante {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #cbd5e1;
            animation: pulsarElemento 4s infinite ease-in-out;
            pointer-events: none;
        }

        /* Borboletas mágicas geradas por CSS no fundo */
        .borboleta-pulsante {
            position: absolute;
            width: 14px;
            height: 14px;
            background: rgba(148, 163, 184, 0.4);
            border-radius: 50% 50% 0 50%;
            transform: rotate(45deg);
            animation: pulsarElemento 5s infinite ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
        }
        .borboleta-pulsante::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: rgba(203, 213, 225, 0.4);
            border-radius: 50% 50% 50% 0;
            top: -7px; left: 7px;
        }

        @keyframes pulsarElemento {
            0%, 100% { opacity: 0.15; transform: scale(0.7) translateY(0px); }
            50% { opacity: 0.85; transform: scale(1.2) translateY(-4px); }
        }

        /* ESTRUTURA PRINCIPAL */
        .container-experiencia {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            z-index: 10;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* CONTAINER DA BORDA DE OURO ANIMADA (CORRENTE) */
        .borda-ouro-correndo {
            position: relative;
            width: 100%;
            height: 456px; /* Ajustado para cobrir perfeitamente o envelope */
            border-radius: 12px;
            overflow: hidden;
            padding: 4px; /* Espessura da borda animada */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            transition: transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* Efeito do feixe de luz girando ao fundo */
        .borda-ouro-correndo::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(
                transparent, 
                var(--ouro-escuro), 
                var(--ouro-brilhante), 
                var(--ouro-escuro), 
                transparent 40%
            );
            animation: girarBorda 4s linear infinite;
        }

        @keyframes girarBorda {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ENVELOPE CONFIGURADO COMO CAMADA INTERNA */
        .envelope-realista {
            position: relative;
            background-color: var(--papel-canva);
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            width: 100%;
            height: 100%;
            border-radius: 8px;
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            box-shadow: inset 0 0 40px rgba(139,92,26,0.15);
        }

        /* Efeito de hover integrado no bloco completo */
        .borda-ouro-correndo:hover {
            transform: scale(1.04);
            box-shadow: 0 35px 70px rgba(0,0,0,0.9), 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .carimbo-militar {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--vermelho-militar);
            font-weight: 900;
            border: 1px dashed var(--vermelho-militar);
            padding: 5px 14px;
            margin-bottom: 35px;
            font-family: 'Courier New', monospace;
            opacity: 0.85;
        }

        .nome-doutora {
            font-family: 'Cinzel', serif;
            font-size: 2.6rem;
            color: #1e293b;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.6);
        }

        .subtitulo-medica {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #5c4d3c;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .tarja-sigiloso {
            font-size: 1.4rem;
            letter-spacing: 9px;
            color: var(--vermelho-militar);
            font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            border: 4px double var(--vermelho-militar);
            padding: 4px 25px;
            transform: rotate(-1deg);
            margin-bottom: auto;
        }

        .bloco-paciente {
            width: 100%;
            text-align: center;
            border-top: 1px dashed rgba(0, 0, 0, 0.15);
            padding-top: 20px;
            margin-bottom: 10px;
        }

        .rotulo-paciente {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #78350f;
            letter-spacing: 3px;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .texto-identificacao {
            font-style: italic;
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .lacre-cera {
            width: 76px; height: 76px;
            background: radial-gradient(circle at 35% 35%, #a11818 0%, #4c0505 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -3px -3px 10px rgba(0,0,0,0.8);
            position: absolute;
            bottom: -38px;
            z-index: 5;
        }

        .lacre-cera::after {
            content: 'Ψ';
            color: #1e0202;
            font-size: 2.6rem;
            font-family: 'Times New Roman', serif;
        }

        /* BOTÃO LUXUOSO COM ZOOM SUAVE */
        .wrapper-botao {
            margin-top: 20px;
            padding: 2px;
            border-radius: 40px;
            background: linear-gradient(90deg, rgba(255,255,255,0.1), var(--ferro-prata), rgba(255,255,255,0.1));
            background-size: 200% auto;
            box-shadow: 0 0 20px rgba(148, 163, 184, 0.15);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease;
        }

        .btn-experiencia {
            background: #030712;
            color: #f8fafc;
            border: none;
            padding: 18px 50px;
            border-radius: 38px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            display: block;
            outline: none;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .wrapper-botao:hover {
            transform: scale(1.07);
            box-shadow: 0 0 30px var(--ferro-prata);
            background-position: right center;
        }
        
        .wrapper-botao:hover .btn-experiencia {
            background: var(--ferro-prata);
            color: #030712;
        }

        #prontuario-frame {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
            z-index: 200;
            display: none; 
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        @media (max-height: 620px) {
            .container-experiencia { gap: 25px; }
            .borda-ouro-correndo { height: 406px; }
            .nome-doutora { font-size: 2.1rem; }
            .subtitulo-medica { margin-bottom: 25px; }
            .tarja-sigiloso { font-size: 1.15rem; }
            .btn-experiencia { padding: 14px 40px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- Fundo de Estrelas e Borboletas -->
    <div id="cenario-cosmos"></div>

    <!-- Tela Inicial: Envelope com a nova Borda Ouro que corre continuamente -->
    <div class="container-experiencia" id="painel-principal">
        <div class="borda-ouro-correndo">
            <div class="envelope-realista">
                <div class="carimbo-militar">CONFIDENCIAL • L</div>
                
                <div class="nome-doutora">Dra. Débora</div>
                <div class="subtitulo-medica">Oficial Médica que Cura a Alma</div>
                
                <div class="tarja-sigiloso">SIGILOSO</div>

                <div class="bloco-paciente">
                    <span class="rotulo-paciente">Paciente:</span>
                    <span class="texto-identificacao">"A pessoa que jamais esquecerá você"</span>
                </div>

                <div class="lacre-cera"></div>
            </div>
        </div>

        <div class="wrapper-botao">
            <button class="btn-experiencia" onclick="dispararTudo()">Aperte com carinho</button>
        </div>
    </div>

    <!-- Iframe oculto para transição -->
    <iframe id="prontuario-frame" src="prontuario.htm"></iframe>

    <!-- Áudio de Fundo -->
    <audio id="musica-elvis" src="elvis.html.mp3" preload="auto" loop></audio>

    <script>
        // Distribuição dinâmica de estrelas pratas e borboletas
        const cosmos = document.getElementById('cenario-cosmos');
        const totalElementos = 80;

        for (let i = 0; i < totalElementos; i++) {
            const elemento = document.createElement('div');
            if (i % 3 === 0) {
                elemento.className = 'borboleta-pulsante';
                elemento.style.left = Math.random() * 100 + 'vw';
                elemento.style.top = Math.random() * 100 + 'vh';
            } else {
                elemento.className = 'estrela-pulsante';
                const tamanho = Math.random() * 2 + 1.5;
                elemento.style.width = `${tamanho}px`;
                elemento.style.height = `${tamanho}px`;
                elemento.style.top = Math.random() * 100 + 'vh';
                elemento.style.left = Math.random() * 100 + 'vw';
            }
            elemento.style.animationDelay = Math.random() * 4 + 's';
            elemento.style.animationDuration = (Math.random() * 2 + 3) + 's';
            cosmos.appendChild(elemento);
        }

        // Função de disparo pelo botão
        function dispararTudo() {
            const som = document.getElementById('musica-elvis');
            const interfaceOriginal = document.getElementById('painel-principal');
            const frameProntuario = document.getElementById('prontuario-frame');

            som.play().catch(err => console.log("Áudio iniciado."));

            interfaceOriginal.style.opacity = '0';
            interfaceOriginal.style.transform = 'scale(0.92)';

            setTimeout(() => {
                interfaceOriginal.style.display = 'none';
                frameProntuario.style.display = 'block';
                setTimeout(() => {
                    frameProntuario.style.opacity = '1';
                }, 50);
            }, 1000);
        }
    </script>
</body>
</html>
