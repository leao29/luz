<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Dra. Debora</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght=0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030712;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
            font-family: 'Playfair Display', serif;
        }

        /* Fundo Cósmico Azul com Estrelas */
        #starsContainer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at center, #061530 0%, #020617 100%);
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: pulseStar 2s infinite ease-in-out alternate;
        }

        /* Estrelas cadentes caindo de todos os lados */
        .falling-star {
            position: absolute;
            width: 1.5px;
            height: 70px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), transparent);
            opacity: 0;
            animation: fallAnimation 4s infinite linear;
        }

        @keyframes pulseStar {
            0% { opacity: 0.15; transform: scale(0.8); }
            100% { opacity: 0.85; transform: scale(1.2); }
        }

        @keyframes fallAnimation {
            0% { transform: translateY(-80px); opacity: 0; }
            10% { opacity: 0.6; }
            50% { transform: translateY(100vh); opacity: 0; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* CARD PRINCIPAL RESPONSIVO */
        .card-frame {
            position: relative;
            z-index: 10;
            width: 92vw;
            max-width: 500px; 
            min-height: 70vh;
            max-height: 85vh;
            border-radius: 24px;
            padding: 4px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            background-size: 300% 300%;
            animation: goldenFlow 6s ease infinite, goldGlow 4s infinite ease-in-out alternate;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease, opacity 0.8s ease;
            display: flex;
        }

        @keyframes goldenFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes goldGlow {
            0% { box-shadow: 0 5px 20px rgba(191, 149, 63, 0.3); }
            100% { box-shadow: 0 12px 45px rgba(252, 246, 186, 0.5); }
        }

        .card-frame:hover {
            transform: scale(1.01) translateY(-2px);
        }

        .card-content {
            width: 100%;
            background: radial-gradient(circle at center, #111625 0%, #040a17 100%);
            border-radius: 21px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(20px, 5vw, 35px);
            border: 1px solid rgba(191, 149, 63, 0.15);
        }

        .card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .luxury-tag {
            color: #bf953f;
            opacity: 0.6;
            font-family: 'Cinzel', serif;
            font-size: clamp(9px, 2.2vw, 11px);
            letter-spacing: 2px;
        }

        .stamp-confidential {
            border: 1.5px solid #ff3b30;
            color: #ff3b30;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: clamp(9px, 2.2vw, 11px);
            padding: 2px 10px;
            transform: rotate(-4deg);
            border-radius: 4px;
            letter-spacing: 2px;
            background: rgba(255, 59, 48, 0.08);
            text-shadow: 0 0 4px rgba(255, 59, 48, 0.4);
            box-shadow: inset 0 0 4px rgba(255, 59, 48, 0.2), 0 2px 8px rgba(0,0,0,0.4);
        }

        .envelope-body {
            text-align: center;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .title-recipient {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(42px, 10vw, 65px);
            background: linear-gradient(180deg, #ffffff 0%, #e5e7eb 40%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
            letter-spacing: 1px;
            display: inline-block;
        }

        .subtitle-sender {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(14px, 3.5vw, 19px);
            background: linear-gradient(180deg, #ffffff 0%, #d1d5db 50%, #afb4be 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.7));
            letter-spacing: 1px;
            opacity: 0.95;
            display: inline-block;
        }

        /* SELO PREMIUM DE ALTA VISIBILIDADE COM PÉROLA NEGRA */
        .seal-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
        }

        .wax-seal {
            width: clamp(80px, 20vw, 95px);
            height: clamp(80px, 20vw, 95px);
            background: radial-gradient(circle at 35% 35%, #5a5a5e 0%, #2a2a2e 50%, #0e0e12 100%);
            border-radius: 51% 49% 52% 48% / 48% 53% 47% 52%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.85), inset 2px 2px 6px rgba(255, 255, 255, 0.25), inset -4px -4px 10px rgba(0, 0, 0, 0.9);
            border: 1px solid #1a1a1f;
            position: relative;
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
        }

        .perola-negra-canva {
            position: absolute;
            width: 44%;
            height: 44%;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 255, 255, 0.15);
            pointer-events: none;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #cbd5e1 20%, #475569 50%, #0f172a 85%, #020617 100%);
            animation: flutuarPerola 3.5s infinite ease-in-out;
        }

        .wax-seal:hover {
            transform: scale(1.06) rotate(3deg);
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.4), inset -3px -3px 8px rgba(0,0,0,0.95), inset 4px 4px 6px rgba(255,255,255,0.7);
        }

        .psychiatry-symbol {
            width: 40%;
            height: 40%;
            color: #ffffff;
            filter: drop-shadow(1px 2px 4px rgba(0, 0, 0, 0.95));
            z-index: 3;
        }

        @keyframes flutuarPerola {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-3px) scale(1.02); }
        }

        /* BOTÃO DE AÇÃO RESPONSIVO - FERRO PRATA CHUMBADO LUXUOSO */
        .action-button-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: 5px;
            margin-top: 10px;
        }

        .btn-luxury {
            background: linear-gradient(135deg, #2e3541 0%, #151a22 50%, #0b0d12 100%);
            color: #ffffff;
            font-family: 'Playfair Display', serif; 
            font-weight: 700;
            font-size: clamp(12px, 2.8vw, 15px);
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 16px 28px;
            border-radius: 40px;
            cursor: pointer;
            outline: none;
            position: relative;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.75), 
                        inset 0 1px 4px rgba(255, 255, 255, 0.25),
                        0 0 0 2px rgba(15, 20, 28, 0.8);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            width: 100%;
            max-width: 420px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        .btn-luxury::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-20deg);
            animation: silverShimmerSweep 4.5s infinite ease-in-out;
        }

        @media (min-width: 600px) {
            .btn-luxury {
                animation: silverAuraPulse 3s infinite ease-in-out;
            }
        }

        @keyframes silverShimmerSweep {
            0% { left: -150%; }
            22% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes silverAuraPulse {
            0% { border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 5px rgba(255, 255, 255, 0.15); }
            50% { border-color: rgba(255, 255, 255, 1); box-shadow: 0 6px 22px rgba(0,0,0,0.6), 0 0 15px rgba(255, 255, 255, 0.35); }
            100% { border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 5px rgba(255, 255, 255, 0.15); }
        }

        .btn-luxury:hover {
            border-color: rgba(255, 255, 255, 1);
            letter-spacing: 2.5px;
            transform: translateY(-2px);
            background: linear-gradient(135deg, #3d4656 0%, #1c232e 50%, #0f131a 100%);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85), inset 0 1px 4px rgba(255, 255, 255, 0.35);
        }

        /* PAINEL DE ÁUDIO REFINADO */
        .audio-controls-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 6, 18, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .audio-controls-panel.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .btn-play-pause {
            background: none;
            border: none;
            color: #d4af37;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            font-family: 'Cinzel', serif;
            white-space: nowrap;
        }

        .vol-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 60px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d4af37;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="starsContainer"></div>

    <div class="card-frame" id="mainCard">
        <div class="card-content">
            <div class="card-header">
                <span class="luxury-tag">DOCUMENTO EXCLUSIVO</span>
                <span class="stamp-confidential">CONFIDENCIAL</span>
            </div>

            <div class="envelope-body">
                <h1 class="title-recipient">Dra. Debora</h1>
                <p class="subtitle-sender">Paciente: A que jamais esquecerá você</p>
            </div>

            <div class="seal-container">
                <div class="wax-seal">
                    <svg class="psychiatry-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v17" />
                        <path d="M8 20h8" />
                        <path d="M6 6v3a6 6 0 0 0 12 0V6" />
                    </svg>
                    <div class="perola-negra-canva"></div>
                </div>
            </div>

            <div class="action-button-container">
                <button class="btn-luxury" onclick="irParaProntuario()">APERTE COM CARINHO</button>
            </div>
        </div>
    </div>

    <div class="audio-controls-panel" id="customControls">
        <button class="btn-play-pause" id="playPauseBtn" onclick="togglePlay()">⏸ Pausar</button>
        <input type="range" class="vol-slider" id="volumeControl" min="0" max="1" step="0.1" value="0.8" oninput="ajustarVolume(this.value)">
    </div>

    <audio id="bgAudio" src="elvis.html.mp3" loop></audio>

    <script>
        // Gerador de estrelas dinâmico (Fixas e Cadentes de todos os lados)
        const starsContainer = document.getElementById('starsContainer');
        const totalEstrelas = window.innerWidth < 600 ? 40 : 70;
        
        // Estrelas cintilantes de fundo
        for (let i = 0; i < totalEstrelas; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            starsContainer.appendChild(star);
        }

        // Função para criar estrelas cadentes espalhadas de forma homogênea
        function gerarEstrelaCadente() {
            const fallingStar = document.createElement('div');
            fallingStar.className = 'falling-star';
            
            // Permite surgir em qualquer largura do céu (esquerda, meio ou direita)
            fallingStar.style.left = `${Math.random() * 96 + 2}%`;
            fallingStar.style.top = `${Math.random() * 20}%`;
            fallingStar.style.animationDuration = `${Math.random() * 2 + 2.5}s`;
            
            starsContainer.appendChild(fallingStar);
            
            setTimeout(() => {
                fallingStar.remove();
            }, 4500);
        }

        // Disparador contínuo para a chuva de estrelas vir de todas as direções
        setInterval(gerarEstrelaCadente, 1200);

        const som = document.getElementById('bgAudio');
        const painel = document.getElementById('customControls');
        const mainCard = document.getElementById('mainCard');

        function irParaProntuario() {
            som.volume = 0.8;
            som.play().then(() => {
                localStorage.setItem('musicaTempo', som.currentTime);
                localStorage.setItem('musicaTocando', 'true');
                
                painel.classList.add('visible');
                mainCard.style.opacity = '0';
                mainCard.style.transform = 'scale(0.92) rotateY(-3deg)';

                setTimeout(() => {
                    window.location.href = "prontuario.htm";
                }, 400);
            }).catch((err) => {
                console.log("Erro ao reproduzir áudio:", err);
                window.location.href = "prontuario.htm";
            });
        }

        function togglePlay() {
            const btn = document.getElementById('playPauseBtn');
            if (som.paused) {
                som.play();
                btn.innerText = "⏸ Pausar";
                localStorage.setItem('musicaTocando', 'true');
            } else {
                som.pause();
                btn.innerText = "▶ Play";
                localStorage.setItem('musicaTocando', 'false');
            }
        }

        function ajustarVolume(valor) {
            som.volume = valor;
        }
    </script>
</body>
</html>
