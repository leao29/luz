<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Dra. Debora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030107; font-family: 'Playfair Display', serif; }

        .star { position: absolute; background-color: #ffffff; border-radius: 50%; box-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(180, 200, 255, 0.5); animation: twinkle 3.5s infinite ease-in-out alternate; }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 12px rgba(255, 255, 255, 1), 0 0 20px rgba(212, 175, 55, 0.6); } 100% { opacity: 0.2; transform: scale(0.7); } }

        .card-frame { position: relative; z-index: 10; background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); background-size: 300% 300%; animation: goldenFlow 4s ease infinite, goldGlow 3s infinite ease-in-out alternate; transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease, opacity 0.8s ease; }
        @keyframes goldenFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes goldGlow { 0% { box-shadow: 0 10px 30px rgba(170, 119, 28, 0.5); } 100% { box-shadow: 0 15px 50px rgba(252, 246, 186, 0.8); } }

        .audio-panel { background: rgba(10, 6, 18, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); transition: opacity 0.5s ease, transform 0.5s ease; }
        .vol-slider { -webkit-appearance: none; appearance: none; background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #d4af37; cursor: pointer; box-shadow: 0 0 6px rgba(212, 175, 55, 0.8); }
        
        .iframe-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; }
        .iframe-container.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="flex justify-center items-center h-screen w-screen relative">

    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden" style="background: radial-gradient(circle at center, #0c0622 0%, #020106 100%);">
        <div class="absolute inset-0" id="starsContainer"></div>
    </div>

    <div id="mainCard" class="card-frame w-[92vw] max-w-[850px] aspect-[1000/563] rounded-[24px] p-[5px] md:h-[75vh] md:w-auto md:aspect-[1000/563]">
        <div class="w-full h-full bg-[#030105] rounded-[19px] relative overflow-hidden flex justify-center items-center">
            
            <div id="svgEnvelope" class="absolute inset-0 w-full h-full flex flex-col justify-between p-6 md:p-10 z-10 bg-gradient-to-br from-[#1c140d] via-[#090604] to-[#120c08] transition-opacity duration-700">
                <div class="flex justify-between items-start w-full">
                    <div class="text-[#bf953f] opacity-40 font-serif text-xs">⭐ LUXURY CARD</div>
                    <div class="border-4 border-[#8a1515] text-[#8a1515] font-sans font-extrabold text-[10px] md:text-sm px-2 py-1 rotate-12 rounded tracking-widest uppercase shadow-lg bg-black/40">
                        CONFIDENCIAL
                    </div>
                </div>

                <div class="text-center my-auto flex flex-col gap-3">
                    <h1 class="font-['Great_Vibes'] text-4xl md:text-6xl text-[#fbf5b7] drop-shadow-[0_2px_10px_rgba(0,0,0,0.9)]">
                        Dra. Debora
                    </h1>
                    <p class="font-['Playfair_Display'] italic text-sm md:text-lg text-[#bf953f] drop-shadow-[0_1px_5px_rgba(0,0,0,0.8)]">
                        Paciente: A que jamais esquecerá você
                    </p>
                </div>

                <div class="flex justify-center items-center mb-6">
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-gradient-to-br from-[#6b0f0f] to-[#3a0606] rounded-full border-2 border-[#bf953f] flex items-center justify-center shadow-[0_5px_15px_rgba(0,0,0,0.6)] animate-pulse">
                        <svg class="w-10 h-10 md:w-12 md:h-12 text-[#C0C0C0]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v6m-3-6v8a3 3 0 0 0 6 0V2M9 22h6"/>
                        </svg>
                    </div>
                </div>

                <button onclick="irParaProntuario()" 
                        class="mx-auto mb-8 px-8 py-3 bg-gradient-to-r from-[#bf953f] via-[#fcf6ba] to-[#bf953f] text-[#030105] font-['Playfair_Display'] font-bold rounded-full shadow-[0_4px_15px_rgba(191,149,63,0.4)] hover:shadow-[0_6px_20px_rgba(252,246,186,0.6)] hover:scale-105 transition-all duration-300">
                    Aperte com carinho
                </button>
            </div>

            <img id="cardImg" class="w-full h-full object-cover block opacity-0 absolute inset-0 z-20 transition-opacity duration-1000 ease-in-out">
        </div>
    </div>

    <div class="iframe-container" id="iframeWrapper">
        <iframe id="prontuarioFrame" class="w-full h-full border-none" src="about:blank"></iframe>
    </div>

    <div class="audio-panel fixed bottom-6 right-6 px-5 py-3 rounded-full flex items-center gap-4 z-50 opacity-0 scale-90 pointer-events-none transition-all duration-500" id="customControls">
        <button class="bg-transparent border-none text-[#d4af37] text-sm font-bold cursor-pointer outline-none hover:text-[#fbf5b7] flex items-center gap-1" id="playPauseBtn" onclick="togglePlay()">
            ⏸ Pausar
        </button>
        <span class="text-[#bf953f]/60 text-xs">|</span>
        <input type="range" class="vol-slider w-16 md:w-20 h-1" id="volumeControl" min="0" max="1" step="0.1" value="0.8" oninput="ajustarVolume(this.value)">
    </div>

    <audio id="musica" loop preload="auto">
        <source src="elvis.html.mp3" type="audio/mpeg">
    </audio>

    <script>
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 1.2;
            star.style.width = `${size}px`; star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`; star.style.left = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3.5}s`;
            star.style.animationDuration = `${Math.random() * 2 + 2.5}s`;
            starsContainer.appendChild(star);
        }

        const img = document.getElementById('cardImg');
        const svgEnvelope = document.getElementById('svgEnvelope');
        const timestamp = new Date().getTime();
        const urlPrincipal = `https://raw.githubusercontent.com/leao29/luz/main/image_f768d7.png?v=${timestamp}`;
        img.src = urlPrincipal;

        img.onload = function() { img.classList.add('opacity-100'); svgEnvelope.style.opacity = '0'; setTimeout(() => svgEnvelope.style.display = 'none', 700); };

        const som = document.getElementById('musica');
        const painel = document.getElementById('customControls');
        const frameWrapper = document.getElementById('iframeWrapper');
        const prontuarioFrame = document.getElementById('prontuarioFrame');
        const mainCard = document.getElementById('mainCard');

        function irParaProntuario() {
            som.volume = 0.8;
            som.play().catch(() => console.log("Áudio iniciado."));
            painel.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
            painel.classList.add('opacity-100', 'scale-100');
            prontuarioFrame.src = "prontuario.htm";
            setTimeout(() => {
                mainCard.style.opacity = '0';
                mainCard.style.transform = 'scale(0.9) rotateY(-5deg)';
                frameWrapper.classList.add('active');
            }, 2500); 
        }

        function togglePlay() {
            if (som.paused) { som.play(); document.getElementById('playPauseBtn').innerHTML = "⏸ Pausar"; }
            else { som.pause(); document.getElementById('playPauseBtn').innerHTML = "▶️ Tocar"; }
        }
        function ajustarVolume(valor) { som.volume = valor; }
    </script>
</body>
</html>
