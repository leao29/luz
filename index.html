<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dra. Débora - Oficial</title>
    <style>
        :root {
            --azul-espacial: #030816;
            --vermelho-alerta: #d31212;
            --texto-dra: #0a1d37;
            --ouro-relevo: #bd9b4c;
            --papel-antigo: #e6d5b8;
            --neon-brilho: #00f2ff;
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--azul-espacial);
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* FUNDO ULTRA MODERNO: Nebulosa Cósmica com Estrelas de Alto Brilho */
        #cenario-cosmos {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(157, 0, 255, 0.15) 0%, transparent 45%),
                radial-gradient(circle at center, #0d1b3e 0%, var(--azul-espacial) 100%);
        }

        /* Estrelas muito mais visíveis e brilhantes com correção na animação */
        .estrela-brilhante {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 18px rgba(255, 255, 255, 0.8);
            animation: pulsarPlaneta 3s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulsarPlaneta {
            0%, 100% { opacity: 0.3; transform: scale(0.7); filter: blur(0.5px); }
            50% { opacity: 1; transform: scale(1.4); filter: drop-shadow(0 0 6px rgba(255,255,255,1)); }
        }

        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
            width: 100%;
            height: 100%;
            padding: 20px;
            z-index: 10;
        }

        /* ENVELOPE REALISTA TRIDIMENSIONAL */
        .envelope-container {
            position: relative;
            background: var(--papel-antigo);
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            width: 100%;
            max-width: 430px;
            height: 460px;
            border-radius: 4px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Simulação das dobras de um envelope de verdade */
        .envelope-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(35deg, transparent 49%, rgba(0,0,0,0.04) 50%, transparent 51%),
                linear-gradient(-35deg, transparent 49%, rgba(0,0,0,0.04) 50%, transparent 51%);
            pointer-events: none;
        }

        .envelope-container:hover {
            transform: scale(1.04) rotate(0.5deg);
        }

        /* TEXTOS ORGANIZADOS SEM SOBREPOSIÇÃO */
        .carimbo-militar {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--vermelho-alerta);
            font-weight: 900;
            border: 2px dashed var(--vermelho-alerta);
            padding: 4px 12px;
            margin-bottom: 25px;
            font-family: 'Courier New', monospace;
            transform: rotate(-1deg);
        }

        /* Nome da Doutora Legível e Imponente (Sem Vermelho) */
        .nome-doutora {
            font-size: 2.4rem;
            color: var(--texto-dra);
            font-family: 'Georgia', serif;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8), 0 0 2px var(--ouro-relevo);
            margin-bottom: 5px;
        }

        .subtitulo-medica {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #554433;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .tarja-sigiloso {
            font-size: 1.4rem;
            letter-spacing: 8px;
            color: var(--vermelho-alerta);
            font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            border: 4px double var(--vermelho-alerta);
            padding: 3px 20px;
            margin-bottom: auto;
            transform: rotate(2deg);
        }

        /* Box do Paciente isolado para não bater nas letras */
        .bloco-paciente {
            width: 90%;
            text-align: center;
            border-top: 1px solid rgba(0, 0, 0, 0.15);
            padding-top: 15px;
            margin-bottom: auto;
        }

        .rotulo-paciente {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #665544;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
        }

        .texto-identificacao {
            font-style: italic;
            color: #111111;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* LACRE DE CERA COM SÍMBOLO PSIQUIÁTRICO (Ψ) */
        .lacre-realista {
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, #b81414 0%, #4a0202 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset -3px -3px 8px rgba(0,0,0,0.7);
            z-index: 3;
            margin-top: 10px;
        }

        .lacre-realista::after {
            content: 'Ψ';
            color: #240101;
            font-size: 2.8rem;
            font-family: 'Times New Roman', serif;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.2);
        }

        /* BOTÃO INTERATIVO IMPACTANTE E FUTURISTA (ESTILO SCI-FI CYBERPUNK) */
        .wrapper-botao-futurista {
            position: relative;
            border-radius: 40px;
            padding: 3px;
            background: linear-gradient(90deg, #00f2ff, #9d00ff, #00f2ff);
            background-size: 200% auto;
            animation: moverGradiente 3s linear infinite;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes moverGradiente {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .btn-futurista-neon {
            background: #040a18;
            color: #ffffff;
            border: none;
            padding: 16px 50px;
            border-radius: 38px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            font-weight: 900;
            font-family: 'Arial', sans-serif;
            font-size: 0.85rem;
            display: block;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Efeito Hover Ultra Chamativo */
        .wrapper-botao-futurista:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px var(--neon-brilho), 0 0 15px rgba(157, 0, 255, 0.5);
        }

        .wrapper-botao-futurista:hover .btn-futurista-neon {
            background: transparent;
            color: #040a18;
            font-weight: 900;
        }

        /* Adaptação Inteligente para Celulares */
        @media (max-height: 640px) {
            .container-principal { gap: 15px; }
            .envelope-container { height: 400px; padding: 15px; }
            .nome-doutora { font-size: 1.9rem; }
            .subtitulo-medica { margin-bottom: 15px; }
            .tarja-sigiloso { font-size: 1.1rem; }
            .lacre-realista { width: 60px; height: 60px; }
            .lacre-realista::after { font-size: 2.1rem; }
            .btn-futurista-neon { padding: 12px 35px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- Fundo de Alta Tecnologia Cósmica -->
    <div id="cenario-cosmos"></div>

    <div class="container-principal">
        
        <!-- ENVELOPE REALISTA -->
        <div class="envelope-container">
            <div class="carimbo-militar">CONFIDENCIAL • MARINHA DO BRASIL</div>
            
            <div class="nome-doutora">Dra. Débora</div>
            <div class="subtitulo-medica">Oficial Médica Psiquiatra</div>
            
            <div class="tarja-sigiloso">SIGILOSO</div>

            <div class="bloco-paciente">
                <span class="rotulo-paciente">Identificação do Paciente:</span>
                <span class="texto-identificacao">"A pessoa que jamais esquecerá você"</span>
            </div>

            <!-- Lacre Físico Intacto -->
            <div class="lacre-realista"></div>
        </div>

        <!-- BOTÃO CYBERPUNK DE ALTO IMPACTO -->
        <div class="wrapper-botao-futurista">
            <button class="btn-futurista-neon" onclick="dispararExperiencia()">Aperte com carinho</button>
        </div>

    </div>

    <!-- Elemento oculto local para forçar o desbloqueio do áudio antes da transição -->
    <audio id="som-ativador" src="elvis.html.mp3" preload="auto"></audio>

    <script>
        // Gerador Dinâmico de Estrelas de Alta Visibilidade
        const cosmos = document.getElementById('cenario-cosmos');
        const quantidadeEstrelas = 45;

        for (let i = 0; i < quantidadeEstrelas; i++) {
            const star = document.createElement('div');
            star.className = 'estrela-brilhante';
            
            // Tamanhos variados para profundidade realista
            const tamanho = Math.random() * 4 + 2; 
            star.style.width = `${tamanho}px`;
            star.style.height = `${tamanho}px`;
            
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            
            // Ritmos de pulsação variados
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            
            cosmos.appendChild(star);
        }

        // Função: Toca o som localmente e envia o usuário com a sessão de áudio ativa
        function dispararExperiencia() {
            const som = document.getElementById('som-ativador');
            
            // Dá o play imediato aqui. Isso quebra a barreira de segurança do navegador!
            som.play().then(() => {
                // Guarda no navegador o aviso de que o usuário permitiu o som
                localStorage.setItem('musicaPermitida', 'sim');
                
                // Transição visual impecável
                document.querySelector('.container-principal').style.transition = "all 0.8s ease";
                document.querySelector('.container-principal').style.opacity = "0";
                document.querySelector('.container-principal').style.transform = "scale(0.95)";
                
                setTimeout(() => {
                    // Vai direto para o seu arquivo da carta
                    window.location.href = "carta.html";
                }, 800);
            }).catch((erro) => {
                // Caso falte interação ou arquivo local, força a mudança direto
                window.location.href = "carta.html";
            });
        }
    </script>
</body>
</html>
