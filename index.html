<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Card Dra. Debora</title>
    <style>
        /* CSS para garantir que não haja rolagem e ocupe a tela inteira */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Impede a rolagem */
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container que segura a imagem e a área clicável */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 1920px; /* Ajuste conforme a largura da sua imagem */
            height: auto;
            aspect-ratio: 16 / 9; /* Mantém a proporção da imagem */
        }

        /* A imagem gerada servirá de fundo total */
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garante que a imagem apareça toda sem cortes */
        }

        /* Área clicável invisível sobre o botão "APERTE COM CARINHO" */
        .invisible-button {
            position: absolute;
            bottom: 3.5%; /* Ajuste a posição para alinhar com o botão na imagem */
            left: 50%;
            transform: translateX(-50%);
            width: 28%; /* Ajuste a largura para cobrir o botão na imagem */
            height: 7%; /* Ajuste a altura para cobrir o botão na imagem */
            background: rgba(255, 0, 0, 0); /* Totalmente transparente */
            border: none;
            cursor: pointer;
            outline: none;
        }

        /* Estilo para os controles de áudio quando aparecerem */
        audio {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            opacity: 0.7;
        }
        
        audio:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Substitua 'card_dra_debora.png' pelo nome do arquivo da imagem gerada -->
        <img src="card_dra_debora.png" alt="Card da Dra. Debora" class="card-image">
        
        <!-- Botão invisível sobre o botão desenhado na imagem -->
        <button class="invisible-button" onclick="playMusic()" aria-label="Aperte com carinho para tocar música"></button>
    </div>

    <!-- Elemento de áudio escondido inicialmente -->
    <audio id="myAudio">
        <!-- Substitua pelo link direto do seu repositório no GitHub para o arquivo mp3 -->
        <source src="SEU_LINK_DO_GITHUB/elvis.html.mp3" type="audio/mpeg">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <script>
        function playMusic() {
            var audio = document.getElementById("myAudio");
            
            // Exibe os controles de som (pausar, volume) para o usuário
            audio.controls = true;
            
            // Toca a música
            audio.play().catch(function(error) {
                console.log("A reprodução automática foi bloqueada pelo navegador. O usuário precisa interagir primeiro.");
                // Em muitos navegadores modernos, a música só toca após o clique,
                // então o 'onclick' no botão invisível já resolve isso.
            });

            // Opcional: Redirecionar para o prontuário após X segundos
            // setTimeout(function() {
            //    window.location.href = "prontuario.html"; 
            // }, 5000); // 5000 milissegundos = 5 segundos
        }
    </script>

</body>
</html>
