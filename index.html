<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dra. Débora - Confidencial</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --preto-profundo: #01040a;
            --azul-noite: #03081e;
            --vermelho-carimbo: #8b0000;
            --papel-antigo: #e8dcc4;
            --ouro-borda: #d4af37;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--preto-profundo);
            font-family: 'Lora', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* FUNDO COSMOS COM ESTRELAS PRATAS */
        #cenario-cosmos {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, var(--azul-noite) 0%, var(--preto-profundo) 100%);
        }

        .estrela-prata {
            position: absolute;
            background: #e2e8f0; /* Cor prata/platina */
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
            animation: pulsarEstrela 3s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulsarEstrela {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* CONTAINER PRINCIPAL */
        .container-experiencia {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        /* BORDA DE OURO ANIMADA */
        .moldura-animada {
            position: relative;
            width: 100%;
            height: 500px;
            border-radius: 15px;
            padding: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }

        .moldura-animada::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, var(--ouro-borda), transparent 30%);
            animation: girar 4s linear infinite;
        }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ENVELOPE PAPEL ANTIGO */
        .envelope-papel {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--papel-antigo);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            border-radius: 10px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* TEXTOS E CARIMBOS */
        .nome-debora {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            color: #2c1e14;
            margin-bottom: 20px;
            text-align: center;
        }

        .carimbo-vazado {
            border: 4px solid var(--vermelho-carimbo);
            color: var(--vermelho-carimbo);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.4rem;
            padding: 5px 20px;
            margin: 10px 0;
            transform: rotate(-5deg);
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 5px;
            mix-blend-mode: multiply;
        }

        .tarja-sigiloso {
            background-color: #000;
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            padding: 2px 30px;
            letter-spacing: 10px;
            margin-top: 15px;
            font-size: 1rem;
        }

        .bloco-identificacao {
            margin-top: auto;
            text-align: center;
            width: 100%;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 15px;
            padding-bottom: 30px;
        }

        .label-paciente {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #5d4037;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .valor-paciente {
            display: block;
            font-style: italic;
            font-weight: 700;
            color: #1a1a1a;
            margin-top: 5px;
        }

        /* LACRE DE CERA CHUMBADO */
        .lacre-cera {
            position: absolute;
            bottom: -35px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #b22222, #4a0404);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset -2px -2px 5px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .lacre-cera::before {
            content: 'Ψ';
            font-size: 2.8rem;
            color: rgba(0,0,0,0.5);
            font-family: serif;
        }

        /* BOTÃO */
        .wrapper-botao {
            margin-top: 60px;
            perspective: 1000px;
        }

        .btn-experiencia {
            background: #050a18;
            color: #ffffff;
            border: 2px solid var(--ouro-borda);
            padding: 18px 45px;
            border-radius: 40px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .btn-experiencia:hover {
            background: var(--ouro-borda);
            color: #000;
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--ouro-borda);
        }

        #prontuario-frame {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="cenario-cosmos"></div>

    <div class="container-experiencia" id="painel-principal">
        <div class="moldura-animada">
            <div class="envelope-papel">
                <div class="nome-debora">Dra. Débora</div>
                
                <div class="carimbo-vazado">CONFIDENCIAL</div>
                
                <div class="tarja-sigiloso">SIGILOSO</div>

                <div class="bloco-identificacao">
                    <span class="label-paciente">Paciente:</span>
                    <span class="valor-paciente">"A pessoa que jamais esquecerá você"</span>
                </div>

                <div class="lacre-cera"></div>
            </div>
        </div>

        <div class="wrapper-botao">
            <button class="btn-experiencia" onclick="iniciarExperiencia()">Aperte com carinho</button>
        </div>
    </div>

    <audio id="musica-elvis" src="elvis.html.mp3" loop></audio>
    <iframe id="prontuario-frame" src="prontuario.htm"></iframe>

    <script>
        // Criar estrelas pratas dinâmicas
        const cosmos = document.getElementById('cenario-cosmos');
        for (let i = 0; i < 70; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela-prata';
            const size = Math.random() * 2 + 1;
            estrela.style.width = size + 'px';
            estrela.style.height = size + 'px';
            estrela.style.top = Math.random() * 100 + 'vh';
            estrela.style.left = Math.random() * 100 + 'vw';
            estrela.style.animationDelay = Math.random() * 5 + 's';
            cosmos.appendChild(estrela);
        }

        function iniciarExperiencia() {
            const audio = document.getElementById('musica-elvis');
            audio.play();

            document.getElementById('painel-principal').style.opacity = '0';
            document.getElementById('painel-principal').style.transition = '1s';
            
            setTimeout(() => {
                document.getElementById('painel-principal').style.display = 'none';
                const frame = document.getElementById('prontuario-frame');
                frame.style.display = 'block';
            }, 1000);
        }
    </script>
</body>
</html>
