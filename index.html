<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dra. Débora - Confidencial</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=700&family=Lora:ital,wght=0,400;0,700;1,400&family=Orbitron:wght=700&display=swap" rel="stylesheet">
    <style>
        :root {
            --preto-profundo: #01040a;
            --azul-noite: #03081e;
            --vermelho-carimbo: #8b0000;
            --papel-antigo: #e3d4b6;
            --ouro-escuro: #5c4718;
            --prata-luxo: linear-gradient(135deg, #94a3b8, #ffffff, #cbd5e1, #ffffff, #64748b);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--preto-profundo);
            font-family: 'Lora', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* FUNDO COSMOS COM ESTRELAS PRATAS BRILHANTES */
        #cenario-cosmos {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, var(--azul-noite) 0%, var(--preto-profundo) 100%);
        }

        .estrela-prata {
            position: absolute;
            background: #e2e8f0; 
            border-radius: 50%;
            box-shadow: 0 0 12px 2px #ffffff;
            animation: pulsarEstrela 2.5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulsarEstrela {
            0%, 100% { opacity: 0.3; transform: scale(0.7); filter: blur(0.5px); }
            50% { opacity: 1; transform: scale(1.4); filter: blur(0px); }
        }

        /* CONTAINER PRINCIPAL */
        .container-experiencia {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        /* CARD DO ENVELOPE COM BORDA PRATEADA DE LUXO */
        .card-envelope {
            width: 100%;
            height: 500px;
            border-radius: 18px;
            padding: 4px;
            background: var(--prata-luxo);
            box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 20px rgba(255,255,255,0.1);
            transition: transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.5s ease;
        }

        .card-envelope:hover {
            transform: scale(1.04) translateY(-5px);
            box-shadow: 0 35px 75px rgba(0,0,0,0.95), 0 0 30px rgba(255,255,255,0.2);
        }

        /* PAPEL COM APARÊNCIA ENVELHECIDA PROFUNDA */
        .envelope-papel {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--papel-antigo);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            border: 2px solid var(--ouro-escuro);
            box-shadow: inset 0 0 50px rgba(74, 56, 20, 0.35);
            overflow: hidden;
        }

        /* ESTRELA CÓSMICA PULSANTE CENTRALIZADA NO CARD */
        .estrela-card-central {
            position: absolute;
            top: 25%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(226,232,240,0.8) 20%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
            animation: superPulso 4s infinite ease-in-out;
        }

        @keyframes superPulso {
            0%, 100% { transform: scale(0.8); opacity: 0.4; filter: blur(2px); }
            50% { transform: scale(1.3); opacity: 0.9; filter: blur(0px); }
        }

        /* TEXTOS E CARIMBOS */
        .nome-debora {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            color: #2c1e14;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
            z-index: 2;
        }

        .carimbo-vazado {
            border: 3px double var(--vermelho-carimbo);
            color: var(--vermelho-carimbo);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.4rem;
            padding: 8px 20px;
            margin: 20px 0;
            transform: rotate(-6deg);
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 5px;
            mix-blend-mode: multiply;
            z-index: 2;
        }

        .bloco-identificacao {
            margin-top: auto;
            text-align: center;
            width: 100%;
            border-top: 1px dashed rgba(92, 71, 24, 0.4);
            padding-top: 15px;
            padding-bottom: 40px;
            z-index: 2;
        }

        .label-paciente {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #5d4037;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .valor-paciente {
            display: block;
            font-style: italic;
            font-weight: 700;
            color: #1a1a1a;
            margin-top: 5px;
            font-size: 1.05rem;
        }

        /* LACRE DE CERA CHUMBADO */
        .lacre-cera {
            position: absolute;
            bottom: -35px;
            width: 85px;
            height: 85px;
            background: radial-gradient(circle at 35% 35%, #b22222 0%, #660000 70%, #3a0000 100%);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset -3px -3px 8px rgba(0,0,0,0.6), inset 3px 3px 6px rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .lacre-cera::before {
            content: 'Ψ';
            font-size: 2.6rem;
            color: rgba(40, 0, 0, 0.65);
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.15);
        }

        /* CARD DO BOTÃO FUTURISTA */
        .card-botao {
            margin-top: 65px;
            padding: 3px;
            background: var(--ouro-escuro);
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card-botao:hover {
            transform: scale(1.06);
        }

        .btn-experiencia {
            background: #040a1c;
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            border-radius: 38px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            font-size: 0.85rem;
            cursor: pointer;
            display: block;
            box-shadow: inset 0 0 12px rgba(255,255,255,0.1);
            transition: background 0.3s;
        }

        .btn-experiencia:hover {
            background: #081233;
        }

        #prontuario-frame {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="cenario-cosmos"></div>

    <div class="container-experiencia" id="painel-principal">
        
        <div class="card-envelope">
            <div class="envelope-papel">
                <div class="estrela-card-central"></div>

                <div class="nome-debora">Dra. Débora</div>
                
                <div class="carimbo-vazado">CONFIDENCIAL</div>

                <div class="bloco-identificacao">
                    <span class="label-paciente">Paciente:</span>
                    <span class="valor-paciente">"A pessoa que jamais esquecerá você"</span>
                </div>

                <div class="lacre-cera"></div>
            </div>
        </div>

        <div class="card-botao">
            <button class="btn-experiencia" onclick="iniciarExperiencia()">Aperte com carinho</button>
        </div>
    </div>

    <audio id="musica-elvis" src="elvis.html.mp3" loop></audio>
    
    <!-- Vinculado ao segundo arquivo: prontuario.htm -->
    <iframe id="prontuario-frame" src="prontuario.htm"></iframe>

    <script>
        const cosmos = document.getElementById('cenario-cosmos');
        for (let i = 0; i < 75; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela-prata';
            const size = Math.random() * 2.5 + 1;
            estrela.style.width = size + 'px';
            estrela.style.height = size + 'px';
            estrela.style.top = Math.random() * 100 + 'vh';
            estrela.style.left = Math.random() * 100 + 'vw';
            estrela.style.animationDelay = Math.random() * 4 + 's';
            estrela.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            cosmos.appendChild(estrela);
        }

        function iniciarExperiencia() {
            const audio = document.getElementById('musica-elvis');
            
            audio.play().then(() => {
                localStorage.setItem('elvis_playing', 'true');
                localStorage.setItem('elvis_time', audio.currentTime);
            }).catch(e => {
                console.log("Erro ao reproduzir áudio:", e);
            });

            document.getElementById('painel-principal').style.opacity = '0';
            document.getElementById('painel-principal').style.transition = 'opacity 1s ease';
            
            setTimeout(() => {
                document.getElementById('painel-principal').style.display = 'none';
                const frame = document.getElementById('prontuario-frame');
                frame.style.display = 'block';
            }, 1000);
        }
    </script>
</body>
</html>
