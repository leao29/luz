<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dra. Débora - Confidencial</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --preto-profundo: #01040a;
            --azul-noite: #03081e;
            --vermelho-carimbo: #8b0000;
            --papel-antigo: #e8dcc4;
            --ouro-escuro: #5c4718; /* Borda ouro escuro refinada */
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--preto-profundo);
            font-family: 'Lora', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* FUNDO COSMOS COM ESTRELAS PRATAS BRILHANTES E PULSANTES */
        #cenario-cosmos {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, var(--azul-noite) 0%, var(--preto-profundo) 100%);
        }

        .estrela-prata {
            position: absolute;
            background: #e2e8f0; 
            border-radius: 50%;
            box-shadow: 0 0 12px 2px #ffffff;
            animation: pulsarEstrela 2.5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulsarEstrela {
            0%, 100 ChatHistory { opacity: 0.3; transform: scale(0.7); filter: blur(0.5px); }
            50% { opacity: 1; transform: scale(1.4); filter: blur(0px); }
        }

        /* CONTAINER PRINCIPAL */
        .container-experiencia {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        /* CARD DO ENVELOPE ESTILO CANVA COM MOLDURA OURO ESCURO */
        .card-envelope {
            width: 100%;
            height: 500px;
            border-radius: 14px;
            padding: 4px;
            background: var(--ouro-escuro);
            box-shadow: 0 25px 60px rgba(0,0,0,0.85);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* Zoom Sutil no Card do Envelope */
        .card-envelope:hover {
            transform: scale(1.03);
        }

        .envelope-papel {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--papel-antigo);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: inset 0 0 40px rgba(92, 71, 24, 0.2); /* Sombra interna estilo Canva */
        }

        /* TEXTOS E CARIMBOS */
        .nome-debora {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            color: #2c1e14;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
        }

        .carimbo-vazado {
            border: 3px double var(--vermelho-carimbo);
            color: var(--vermelho-carimbo);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.3rem;
            padding: 5px 15px;
            margin: 8px 0;
            transform: rotate(-6deg);
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 4px;
            mix-blend-mode: multiply;
        }

        .tarja-sigiloso {
            background-color: #1a1510;
            color: var(--papel-antigo);
            font-family: 'Arial Black', sans-serif;
            padding: 4px 25px;
            letter-spacing: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            box-shadow: 1px 2px 5px rgba(0,0,0,0.3);
            transform: rotate(2deg);
        }

        .bloco-identificacao {
            margin-top: auto;
            text-align: center;
            width: 100%;
            border-top: 1px dashed rgba(92, 71, 24, 0.3);
            padding-top: 15px;
            padding-bottom: 40px;
        }

        .label-paciente {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #5d4037;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .valor-paciente {
            display: block;
            font-style: italic;
            font-weight: 700;
            color: #1a1a1a;
            margin-top: 5px;
            font-size: 1.05rem;
        }

        /* LACRE DE CERA CHUMBADO COM SÍMBOLO PSIQUIÁTRICO (Ψ) */
        .lacre-cera {
            position: absolute;
            bottom: -35px;
            width: 85px;
            height: 85px;
            background: radial-gradient(circle at 35% 35%, #b22222 0%, #660000 70%, #3a0000 100%);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset -3px -3px 8px rgba(0,0,0,0.6), inset 3px 3px 6px rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .lacre-cera::before {
            content: 'Ψ';
            font-size: 2.6rem;
            color: rgba(40, 0, 0, 0.65);
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.15);
        }

        /* CARD DO BOTÃO FUTURISTA COM BORDA OURO ESCURO */
        .card-botao {
            margin-top: 65px;
            padding: 3px;
            background: var(--ouro-escuro);
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* Zoom Sutil no Card do Botão */
        .card-botao:hover {
            transform: scale(1.06);
        }

        .btn-experiencia {
            background: #040a1c;
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            border-radius: 38px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            font-size: 0.85rem;
            cursor: pointer;
            display: block;
            box-shadow: inset 0 0 12px rgba(255,255,255,0.1);
            transition: background 0.3s;
        }

        .btn-experiencia:hover {
            background: #081233;
        }

        #prontuario-frame {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="cenario-cosmos"></div>

    <div class="container-experiencia" id="painel-principal">
        
        <!-- CARD DO ENVELOPE -->
        <div class="card-envelope">
            <div class="envelope-papel">
                <div class="nome-debora">Dra. Débora</div>
                
                <div class="carimbo-vazado">CONFIDENCIAL</div>
                <div class="tarja-sigiloso">SIGILOSO</div>

                <div class="bloco-identificacao">
                    <span class="label-paciente">Paciente:</span>
                    <span class="valor-paciente">"A pessoa que jamais esquecerá você"</span>
                </div>

                <!-- Lacre com símbolo Psiquiátrico -->
                <div class="lacre-cera"></div>
            </div>
        </div>

        <!-- CARD DO BOTÃO FUTURISTA -->
        <div class="card-botao">
            <button class="btn-experiencia" onclick="iniciarExperiencia()">Aperte com carinho</button>
        </div>
    </div>

    <!-- Áudio Atualizado para elvis.mp3 -->
    <audio id="musica-elvis" src="elvis.mp3" loop></audio>
    <iframe id="prontuario-frame" src="prontuario.htm"></iframe>

    <script>
        // Gerador de estrelas pratas brilhantes e pulsantes
        const cosmos = document.getElementById('cenario-cosmos');
        for (let i = 0; i < 75; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela-prata';
            const size = Math.random() * 2.5 + 1;
            estrela.style.width = size + 'px';
            estrela.style.height = size + 'px';
            estrela.style.top = Math.random() * 100 + 'vh';
            estrela.style.left = Math.random() * 100 + 'vw';
            estrela.style.animationDelay = Math.random() * 4 + 's';
            estrela.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            cosmos.appendChild(estrela);
        }

        function iniciarExperiencia() {
            const audio = document.getElementById('musica-elvis');
            audio.play().catch(e => console.log("Erro ao reproduzir áudio:", e));

            document.getElementById('painel-principal').style.opacity = '0';
            document.getElementById('painel-principal').style.transition = 'opacity 1s ease';
            
            setTimeout(() => {
                document.getElementById('painel-principal').style.display = 'none';
                const frame = document.getElementById('prontuario-frame');
                frame.style.display = 'block';
            }, 1000);
        }
    </script>
</body>
</html>
