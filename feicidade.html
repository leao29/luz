<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Felicidade - O Encontro da Paz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-cosmos: #03081e;
            --ouro-escuro: #4a3b13;
            --ouro-brilhante: #8c7333;
            --prata-fina: #e2e8f0;
            --texto-cor: #211a10;
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            width: 100%; min-height: 100vh;
            background-color: var(--azul-cosmos);
            font-family: 'Lora', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow: hidden;
            transition: opacity 1.5s ease;
        }

        #fundo-cosmos {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0d1b46 0%, var(--azul-cosmos) 100%);
        }

        .estrela-final {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            filter: blur(1px);
            animation: brilhoSuave infinite alternate ease-in-out;
        }

        @keyframes brilhoSuave {
            from { opacity: 0.2; transform: scale(1); }
            to { opacity: 0.8; transform: scale(1.4); }
        }

        .container-final {
            max-width: 700px;
            width: 100%;
            text-align: center;
            z-index: 10;
            animation: entradaEterea 2.5s ease-out forwards;
        }

        @keyframes entradaEterea {
            0% { opacity: 0; transform: translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .moldura-ouro {
            background: rgba(244, 235, 208, 0.95);
            padding: 50px 40px;
            border-radius: 15px;
            border: 2px solid var(--ouro-brilhante);
            box-shadow: 0 0 40px rgba(140, 115, 51, 0.4), inset 0 0 20px rgba(0,0,0,0.1);
            position: relative;
        }

        .titulo-final {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--ouro-escuro);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 30px;
        }

        .texto-conclusao {
            font-size: 1.25rem;
            line-height: 2;
            color: var(--texto-cor);
            font-style: italic;
            margin-bottom: 40px;
        }

        .divisor-diamante {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .linha { height: 1px; width: 60px; background: var(--ouro-brilhante); }
        .diamante { width: 10px; height: 10px; background: var(--ouro-brilhante); transform: rotate(45deg); }

        .btn-finalizar {
            background: var(--azul-cosmos);
            color: var(--prata-fina);
            border: 1px solid var(--ouro-brilhante);
            padding: 18px 45px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.5s;
            border-radius: 4px;
        }

        .btn-finalizar:hover {
            background: var(--ouro-escuro);
            box-shadow: 0 0 25px rgba(140, 115, 51, 0.6);
            letter-spacing: 5px;
        }

        /* PAINEL DE ÁUDIO DISCRETO */
        .audio-minimo {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .vol-input { accent-color: var(--ouro-brilhante); width: 80px; cursor: pointer; }

        @media (max-width: 600px) {
            .moldura-ouro { padding: 40px 20px; }
            .titulo-final { font-size: 1.5rem; }
            .texto-conclusao { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div id="fundo-cosmos"></div>

    <div class="container-final">
        <div class="moldura-ouro">
            <h1 class="titulo-final">Paz e Serenidade</h1>
            
            <div class="divisor-diamante">
                <div class="linha"></div>
                <div class="diamante"></div>
                <div class="linha"></div>
            </div>

            <p class="texto-conclusao">
                "A jornada que trilhamos até aqui não termina em um ponto final, mas sim em um horizonte de novas possibilidades. Sigo com a leveza de quem soube falar ao coração e a certeza de que a felicidade é, acima de tudo, o encontro da nossa alma com a nossa própria verdade."
            </p>

            <button class="btn-finalizar" onclick="encerrar()">Finalizar Jornada</button>
        </div>
    </div>

    <div class="audio-minimo">
        <button id="playPause" style="background:none; border:none; color:white; cursor:pointer; font-size:16px;">⏸️</button>
        <input type="range" class="vol-input" min="0" max="1" step="0.1" value="1" oninput="ajustarVol(this.value)">
    </div>

    <audio id="trilha-final" src="elvis.html.mp3" loop></audio>

    <script>
        // Estrelas de fundo
        const cosmos = document.getElementById('fundo-cosmos');
        for (let i = 0; i < 40; i++) {
            const s = document.createElement('div');
            s.className = 'estrela-final';
            const size = Math.random() * 4 + 1;
            s.style.width = s.style.height = size + 'px';
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDuration = (Math.random() * 4 + 3) + 's';
            cosmos.appendChild(s);
        }

        const audio = document.getElementById('trilha-final');
        const btnPP = document.getElementById('playPause');

        // Sincronização de áudio
        window.onload = () => {
            const tempoSalvo = localStorage.getItem('musica_tempo');
            if (tempoSalvo) audio.currentTime = parseFloat(tempoSalvo);
            
            audio.play().catch(() => {
                btnPP.innerText = "▶️";
            });
        };

        btnPP.onclick = () => {
            if (audio.paused) {
                audio.play();
                btnPP.innerText = "⏸️";
            } else {
                audio.pause();
                btnPP.innerText = "▶️";
            }
        };

        function ajustarVol(v) { audio.volume = v; }

        function encerrar() {
            document.body.style.opacity = '0';
            // Limpa dados de navegação para um novo início se desejado
            localStorage.removeItem('musica_tempo');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>
