<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Capa Final - Dra. Débora</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Orbitron:wght@400;600&family=Lora:ital,wght=0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-cosmos: #020617;
            --azul-capa: #040918;
            --ouro-escuro: #4a3b13;
            --ouro-brilhante: #c5a85c;
            --texto-claro: #f1f5f9;
            --texto-ouro: #e2c792;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            width: 100%; min-height: 100vh;
            background-color: var(--azul-cosmos);
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            perspective: 2000px;
        }

        #fundo-cosmos {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at center, #0a1931 0%, #040d21 60%, var(--azul-cosmos) 100%);
        }

        .estrela {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: brilho infinite ease-in-out;
        }

        @keyframes brilho {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.4); }
        }

        /* PAINEL DE MÚSICA DE LUXO */
        .painel-musica-fixo {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(5, 11, 30, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--ouro-escuro);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .btn-controle {
            background: transparent;
            border: 1px solid var(--ouro-brilhante);
            color: var(--ouro-brilhante);
            padding: 4px 14px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            cursor: pointer;
        }
        
        .vol-slider { width: 70px; accent-color: var(--ouro-brilhante); }

        /* DESIGN DA CONTRA CAPA DO LIVRO LUXUOSO */
        .capa-livro {
            max-width: 550px;
            width: 100%;
            height: 750px;
            background: linear-gradient(135deg, #050c24 0%, #020511 100%);
            border-radius: 12px 24px 24px 12px;
            padding: 25px;
            box-shadow: -15px 30px 60px rgba(0,0,0,0.9), inset 5px 0 15px rgba(255,255,255,0.05);
            border: 2px solid var(--ouro-escuro);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            
            /* Efeito de rotação contrária para simular a folha pousando aberta */
            transform-origin: left center;
            transform: rotateY(120deg) scale(0.8);
            opacity: 0;
            transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease;
        }

        .capa-livro.revelada {
            transform: rotateY(0deg) scale(1);
            opacity: 1;
        }

        /* Moldura de Ouro Barroca Francesa */
        .moldura-ouro {
            position: absolute;
            top: 20px; bottom: 20px; left: 20px; right: 20px;
            border: 1px solid rgba(197, 168, 92, 0.4);
            border-radius: 8px;
            pointer-events: none;
        }

        .moldura-ouro::before {
            content: '';
            position: absolute;
            top: 8px; bottom: 8px; left: 8px; right: 8px;
            border: 2px solid var(--ouro-brilhante);
            opacity: 0.85;
        }

        /* Conteúdo Interno da Capa */
        .conteudo-capa {
            z-index: 2;
            text-align: center;
            margin: auto;
            padding: 0 20px;
        }

        .brasao-final {
            width: 80px; height: 80px;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 15px var(--ouro-brilhante));
            animation: flutuarBrasao 4s infinite ease-in-out;
        }

        @keyframes flutuarBrasao {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .titulo-capa {
            font-size: 2.5rem;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #fff 0%, #e2c792 50%, #c5a85c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .sub-titulo-capa {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--texto-ouro);
            letter-spacing: 2px;
            margin-bottom: 60px;
        }

        .texto-agradecimento {
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #94a3b8;
            max-width: 400px;
            margin: 0 auto 50px auto;
        }

        .autor {
            font-size: 1.4rem;
            color: #ffffff;
            letter-spacing: 4px;
            border-top: 1px solid rgba(197, 168, 92, 0.2);
            padding-top: 20px;
            display: inline-block;
        }

        .selo-fim {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--ouro-brilhante);
            letter-spacing: 6px;
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            .capa-livro { height: 600px; padding: 15px; }
            .titulo-capa { font-size: 1.8rem; }
            .texto-agradecimento { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div id="fundo-cosmos"></div>

    <div class="painel-musica-fixo">
        <button class="btn-controle" id="playPause">PAUSE</button>
        <div style="display:flex; align-items:center; gap:6px;">
            <span style="color:var(--ouro-brilhante); font-size:10px;">🔈</span>
            <input type="range" class="vol-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" oninput="ajustarVol(this.value)">
            <span style="color:var(--ouro-brilhante); font-size:10px;">🔊</span>
        </div>
    </div>

    <div class="capa-livro" id="capaFisica">
        <div class="moldura-ouro"></div>
        
        <div class="conteudo-capa">
            <svg class="brasao-final" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="20" fill="radial-gradient(circle, #475569, #020617)" stroke="#c5a85c" stroke-width="2"/>
                <path d="M50 5 L55 35 L85 35 L60 55 L70 85 L50 65 L30 85 L40 55 L15 35 L45 35 Z" stroke="#c5a85c" stroke-width="1" opacity="0.4"/>
            </svg>

            <h1 class="titulo-capa">O DESTINO</h1>
            <div class="sub-titulo-capa">Foi Conquistado</div>
            
            <p class="texto-agradecimento">
                "As dores transformaram-se em nácar. A longa estrada sob o cosmos moldou a mais rara das joias."
            </p>

            <div class="autor">DRA. DÉBORA</div>
        </div>

        <div class="selo-fim">CONCLUÍDO</div>
    </div>

    <audio id="trilha" src="elvis.html.mp3" loop></audio>

    <script>
        const audio = document.getElementById('trilha');
        const btnPP = document.getElementById('playPause');
        const volumeSlider = document.getElementById('volumeSlider');
        const capaFisica = document.getElementById('capaFisica');

        window.onload = () => {
            audio.volume = 0.5;
            volumeSlider.value = 0.5;

            const tempoSalvo = localStorage.getItem('musica_tempo');
            if (tempoSalvo) { audio.currentTime = parseFloat(tempoSalvo); }
            
            audio.play().then(() => {
                btnPP.innerText = "PAUSE";
            }).catch(() => {
                btnPP.innerText = "PLAY";
            });

            // Dá um leve delay e faz a capa "pousar" aberta na tela elegantemente
            setTimeout(() => {
                capaFisica.classList.add('revelada');
            }, 200);
        };

        audio.ontimeupdate = () => {
            localStorage.setItem('musica_tempo', audio.currentTime);
        };

        btnPP.onclick = () => {
            if (audio.paused) {
                audio.play();
                btnPP.innerText = "PAUSE";
            } else {
                audio.pause();
                btnPP.innerText = "PLAY";
            }
        };

        function ajustarVol(v) { audio.volume = v; }

        // ESTRELAS DE FUNDO
        const cosmos = document.getElementById('fundo-cosmos');
        for (let i = 0; i < 60; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela';
            const tam = Math.random() * 2 + 0.5;
            estrela.style.width = tam + 'px';
            estrela.style.height = tam + 'px';
            estrela.style.top = Math.random() * 100 + '%';
            estrela.style.left = Math.random() * 100 + '%';
            estrela.style.animationDuration = (Math.random() * 5 + 3) + 's';
            cosmos.appendChild(estrela);
        }
    </script>
</body>
</html>
