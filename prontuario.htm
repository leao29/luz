<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dra. Débora - Oficial</title>
    <style>
        :root {
            --azul-profundo: #020611;
            --vermelho-militar: #b30000;
            --prata-raio: linear-gradient(105deg, rgba(255,255,255,0) 30%, rgba(220,225,235,0.4) 45%, rgba(255,255,255,0) 60%);
            /* Tom de pergaminho antigo imperial escurecido luxuoso (nada de bege comum) */
            --envelope-antigo: linear-gradient(135deg, #c5a880 0%, #a3855c 100%);
            --sombra-prata: 0 0 25px rgba(192, 192, 192, 0.4);
        }

        /* Bloqueio absoluto de rolagem e tela cheia imersiva */
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--azul-profundo);
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fundo Dinâmico com Estrelas Pulsantes */
        #cenario-fundo {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0a1326 0%, var(--azul-profundo) 100%);
        }

        .estrela {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #cbd5e1;
            animation: pulsarEstrela 4s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulsarEstrela {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.9; transform: scale(1.3); box-shadow: 0 0 12px #fff; }
        }

        /* Container Principal sem estouro de layout */
        .container-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
            height: 100%;
            padding: 20px;
            z-index: 10;
        }

        /* CARD FUTURISTA / ENVELOPE 3D */
        .envelope-3d {
            position: relative;
            background: var(--envelope-antigo);
            width: 100%;
            max-width: 420px;
            height: 480px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
            overflow: hidden; /* Garante que o raio de prata não vaze do card */
        }

        /* Efeito Raio de Prata Sutil Passando */
        .envelope-3d::before {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 300%; height: 100%;
            background: var(--prata-raio);
            transition: 0s;
            pointer-events: none;
        }

        /* Gatilho do Raio e Zoom (Funciona no PC e no Celular) */
        .envelope-3d:hover, .envelope-3d:active {
            transform: scale(1.03) translateY(-5px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), var(--sombra-prata);
        }

        .envelope-3d:hover::before {
            left: 150%;
            transition: 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Elementos Textuais Internos em Vermelho (Nada se sobrepõe) */
        .cabecalho-militar {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--vermelho-militar);
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .carimbo-nome {
            font-size: 2.2rem;
            color: var(--vermelho-militar);
            border: 3px double var(--vermelho-militar);
            padding: 5px 25px;
            text-transform: uppercase;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 2px;
            margin: 15px 0;
            transform: rotate(-1.5deg);
        }

        .tarja-status {
            font-size: 0.9rem;
            letter-spacing: 7px;
            color: var(--vermelho-militar);
            font-weight: 900;
            margin-bottom: auto;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .bloco-mensagem {
            text-align: center;
            background: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            margin-bottom: auto;
            box-shadow: inset 0 1px 5px rgba(0,0,0,0.1);
        }

        .rotulo-paciente {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #4a3b2c;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .texto-paciente {
            font-style: italic;
            color: #1a0f05;
            font-size: 1.15rem;
            line-height: 1.5;
        }

        /* Lacre de Cera Realista Timbrado com Símbolo de Psiquiatria (Ψ) */
        .lacre-selo {
            width: 75px; height: 75px;
            background: radial-gradient(circle at 35% 35%, #cc0000 0%, #4a0000 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5), inset -2px -2px 6px rgba(0,0,0,0.6);
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));
        }

        .lacre-selo::after {
            content: 'Ψ';
            color: #2b0000;
            font-size: 2.6rem;
            font-family: 'Times New Roman', serif;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.15);
        }

        /* CARD DO BOTÃO INFERIOR INTERATIVO (Estilo Canva Moderno/Descolado) */
        .card-botao {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px;
            border-radius: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
        }

        .btn-interativo {
            background: linear-gradient(135deg, #162238 0%, #08101f 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 14px 40px;
            border-radius: 33px;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Georgia', serif;
            font-size: 0.8rem;
            display: block;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Zoom e Sombras Pratas no Botão (PC e Mobile) */
        .card-botao:hover, .card-botao:active {
            transform: scale(1.05);
            box-shadow: var(--sombra-prata);
        }

        .card-botao:hover .btn-interativo, .card-botao:active .btn-interativo {
            background: #ffffff;
            color: var(--azul-profundo);
            border-color: #ffffff;
        }

        /* Ajustes responsivos para telas pequenas de celular não quebrarem */
        @media (max-height: 620px) {
            .container-principal { gap: 12px; padding: 10px; }
            .envelope-3d { height: 390px; padding: 15px; }
            .carimbo-nome { font-size: 1.7rem; margin: 5px 0; }
            .bloco-mensagem { padding: 8px; }
            .texto-paciente { font-size: 1rem; }
            .lacre-selo { width: 55px; height: 55px; }
            .lacre-selo::after { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Fundo Estelar -->
    <div id="cenario-fundo"></div>

    <div class="container-principal" id="area-conteudo">
        
        <!-- ENVELOPE LUXUOSO 3D -->
        <div class="envelope-3d">
            <div class="cabecalho-militar">CONFIDENCIAL • MARINHA DO BRASIL</div>
            
            <div class="carimbo-nome">Dra. Débora</div>
            
            <div class="tarja-status">SIGILOSO</div>

            <div class="bloco-mensagem">
                <span class="rotulo-paciente">Paciente:</span>
                <span class="texto-paciente">"A pessoa que jamais esquecerá você"</span>
            </div>

            <!-- Lacre Oficial em Cera -->
            <div class="lacre-selo"></div>
        </div>

        <!-- BOTÃO INTERATIVO COM ESTILO CANVA -->
        <div class="card-botao">
            <button class="btn-interativo" onclick="avancarComCarinho()">Aperte com carinho</button>
        </div>

    </div>

    <!-- Gatilho oculto para a música elvis.mp3 rodar automaticamente após a transição -->
    <audio id="trilha-audiovisual" src="elvis.mp3" preload="auto"></audio>

    <script>
        // Sistema que gera as estrelas pratas piscando ao fundo de forma aleatória
        const fundo = document.getElementById('cenario-fundo');
        const numEstrelas = 35;

        for (let i = 0; i < numEstrelas; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela';
            
            // Cria tamanhos diferentes para gerar profundidade 3D visual
            const tamanho = Math.random() * 3 + 1;
            estrela.style.width = `${tamanho}px`;
            estrela.style.height = `${tamanho}px`;
            
            estrela.style.top = Math.random() * 100 + 'vh';
            estrela.style.left = Math.random() * 100 + 'vw';
            
            // Tempos de pulsação dessincronizados para parecer natural
            estrela.style.animationDelay = Math.random() * 4 + 's';
            
            fundo.appendChild(estrela);
        }

        // Função cinematográfica disparada pelo botão
        function avancarComCarinho() {
            const audio = document.getElementById('trilha-audiovisual');
            const conteudo = document.getElementById('area-conteudo');
            
            // Dá o play no áudio por segurança (o navegador valida o clique e autoriza rodar automático na próxima)
            audio.play().catch(() => console.log("Áudio carregado."));
            
            // Efeito fade-out ultra profissional sumindo com o conteúdo antes de trocar de tela
            conteudo.style.transition = "opacity 1.2s ease-in-out";
            conteudo.style.opacity = "0";
            
            setTimeout(() => {
                // Redireciona para a página da carta (carta.html) onde a música começará tocando direto
                window.location.href = "carta.html";
            }, 1200);
        }
    </script>
</body>
</html>
